services:
  web:
    build:
      context: .
      target: web
    ports:
      - "${WEB_PORT:-8766}:80"
    depends_on:
      - api
    restart: unless-stopped

  api:
    build:
      context: .
      target: api
    ports:
      - "127.0.0.1:8787:8787"
    environment:
      HOST: 0.0.0.0
      PORT: 8787
      BRANCH_LEDGER_PRIVATE_DIR: /data/private
      ALLOWED_ORIGINS: "http://127.0.0.1:${WEB_PORT:-8766},http://localhost:${WEB_PORT:-8766},http://127.0.0.1:8787,http://localhost:8787"
    volumes:
      - branch-ledger-data:/data
    restart: unless-stopped

volumes:
  branch-ledger-data:
